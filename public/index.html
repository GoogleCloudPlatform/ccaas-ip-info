<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCAI Platform: Multi-Token Merging Demo</title>
    <link rel="stylesheet" href="/demo.css">
</head>
<body data-company-id="{{COMPANY_ID}}" data-ccaas-host="{{CCAAS_HOST}}">

<div class="container">
    <h1>CCAI Platform Enrichment Service</h1>

    <div class="section">
        <h3>1. Simulate App Data (CRM Context)</h3>
        <p class="hint-text">This JSON simulates data your application already knows (e.g., from a database) that will be merged with live Geo-IP data.</p>
        <textarea id="app-data-input">{
  "loyalty_tier": { "label": "Loyalty", "value": "Gold" },
  "account_status": { "label": "Status", "value": "Active" }
}</textarea>
    </div>

    <div class="section section-no-border">
        <button id="btn-launch" type="button">Launch Enriched Session</button>
        <p id="status-msg" class="status-msg"></p>

        <div id="debug-container" class="hidden">
            <span class="status-badge">Merged JWT Payload (Server-Side)</span>
            <pre id="debug-view"></pre>
        </div>
    </div>
</div>

<!-- CCaaS Widget Container -->
<div id="ccaas-widget"></div>

<!--
  NOTE: public/demo.js is served only when Demo Mode (SERVE_DEMO=true) is enabled.
  Its getAuthToken() helper calls /auth/token for local demo testing only; this
  will be changed before go-live to call the customer's authenticated backend.
-->
<script src="/demo.js"></script>
</body>
</html>
